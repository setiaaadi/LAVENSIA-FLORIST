<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Lavensia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absensi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#162B4A">
<style>
:root{
  --hutan:#162B4A; --daun:#4C7A5E; --kelopak:#E9B7BF; --bunga:#C2566B;
  --latar:#FBF3F2; --kertas:#FFFFFF; --tinta:#25302B; --redam:#6C7A73; --garis:#E7D9D8;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--latar);color:var(--tinta);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.atas{background:var(--hutan);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 22px 64px}
.atas{text-align:center}
.logo{display:block;width:190px;max-width:55%;height:auto;margin:0 auto}
.jam{font-family:Georgia,serif;font-size:52px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.tgl{margin-top:4px;color:#C9D3E3;font-size:15px}
main{max-width:480px;margin:-40px auto 0;padding:0 16px 32px}
.kartu{background:var(--kertas);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(30,59,47,.10)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--latar);border-radius:12px;padding:4px;gap:4px}
.mode button{border:0;background:transparent;padding:12px;border-radius:9px;font-size:16px;font-weight:600;color:var(--redam)}
.mode button.aktif{background:var(--hutan);color:#fff}
.judul{display:block;font-size:14px;color:var(--redam);margin:18px 0 8px}
#pilihNama,#jenis{width:100%;padding:14px;border:1.5px solid var(--garis);border-radius:12px;font-size:16px;font-weight:600;background:#fff;color:var(--tinta)}
#pin{width:100%;padding:14px;border:1.5px solid var(--garis);border-radius:12px;font-size:18px;letter-spacing:6px;background:#fff;color:var(--tinta)}
#pin:focus-visible{outline:3px solid var(--kelopak)}
#kamera{position:fixed;inset:0;z-index:50;background:rgba(20,30,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#kamera video{width:100%;max-width:560px;border-radius:16px;background:#000;transform:scaleX(-1)}
#kamera .aksi{display:flex;gap:12px}
#kamera button{border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700}
#jepret{background:var(--bunga);color:#fff}
#batalKamera{background:#fff;color:var(--tinta)}
#pilihNama:focus-visible,#jenis:focus-visible{outline:3px solid var(--kelopak)}
.nama button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--garis);border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:var(--tinta)}
.nama button.pilih{border-color:var(--hutan);background:#EEF5F0}
.nama .st{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--latar);color:var(--redam)}
.st.masuk{background:#E3F1E8;color:#1E5136}
.st.selesai{background:#E6E8F5;color:#2F3A7A}
.st.cuti{background:#FBE3E6;color:#8E2A3C}
button:focus-visible,input:focus-visible{outline:3px solid var(--kelopak)}
.info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--latar);font-size:15px}
.foto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;width:100%;aspect-ratio:4/3;border:2px dashed var(--kelopak);border-radius:14px;background:var(--latar);color:var(--bunga);font-weight:600;overflow:hidden;cursor:pointer;position:relative}
.foto small{color:var(--redam);font-weight:400}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ambilFoto{display:none}
.tanggal{display:block}
.tanggal label{font-size:13px;color:var(--redam)}
.tanggal input{width:100%;margin-top:4px;padding:12px;border:1.5px solid var(--garis);border-radius:12px;font-size:16px;background:#fff;color:var(--tinta)}
.lokasi{margin-top:14px;font-size:14px;color:var(--redam)}
.lokasi.ok{color:var(--daun)} .lokasi.gagal{color:var(--bunga)}
.kirim{margin-top:18px;width:100%;border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:700;background:var(--bunga);color:#fff}
.kirim:disabled{opacity:.5}
.pesan{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
.pesan.ok{display:block;background:#E3F1E8;color:#1E5136}
.pesan.err{display:block;background:#FBE3E6;color:#8E2A3C}
h2{font-family:Georgia,serif;font-weight:normal;font-size:19px;margin:26px 4px 10px}
.baris{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--garis);font-size:15px}
.baris:last-child{border-bottom:0}
.baris .w{color:var(--redam);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.kosong{color:var(--redam);font-size:14px;padding:8px 4px}
.chip{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--latar);color:var(--redam)}
.cutiBaris{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--garis);font-size:15px}
.cutiBaris:last-child{border-bottom:0}
.hidden,#kamera.hidden{display:none}
</style>
</head>

<main>
  <section class="kartu">
    <div class="mode">
      <button id="tabAbsen" class="aktif" type="button">Absen</button>
      <button id="tabCuti" type="button">Tidak hadir</button>
    </div>

    <span class="judul">Pilih nama</span>
    <select id="pilihNama"></select>

    <span class="judul">PIN</span>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 angka">

    <!-- Absen -->
    <div id="panelAbsen">
      <div class="info hidden" id="info"></div>
      <span class="judul">Foto selfie</span>
      <label class="foto" for="ambilFoto" id="kotakFoto">
        <span>Ketuk untuk foto selfie</span>
        <small>Kamera depan akan terbuka</small>
      </label>
      <input id="ambilFoto" type="file" accept="image/*" capture="user">
      <div class="lokasi" id="lokasi">Lokasi akan dicek saat kirim.</div>
      <button class="kirim" id="kirimAbsen" type="button" disabled>Pilih nama dulu</button>
    </div>

    <!-- Cuti / Izin / Sakit -->
    <div id="panelCuti" class="hidden">
      <div class="info hidden" id="infoCuti"></div>
      <div id="daftarCuti" class="hidden" style="margin-top:14px"></div>
      <span class="judul">Jenis</span>
      <select id="jenis"><option value="Cuti">Cuti</option><option value="Izin">Izin</option><option value="Sakit">Sakit</option></select>
      <div class="tanggal" style="margin-top:14px">
        <label>Tanggal<input type="date" id="tglCuti"></label>
      </div>
      <button class="kirim" id="kirimCuti" type="button" disabled>Pilih nama dulu</button>
    </div>

    <div class="pesan" id="pesan"></div>
  </section>

  <h2>Hari ini</h2>
  <section class="kartu" id="hariIni"><div class="kosong">Memuat…</div></section>
</main>

<div id="kamera" class="hidden">
  <video id="vid" autoplay playsinline muted></video>
  <div class="aksi"><button type="button" id="jepret">Ambil foto</button><button type="button" id="batalKamera">Batal</button></div>
</div>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwK4JxWSGq4K843Tmo6499HKDSjN5FAf0O0Sk4ifbKNrycDwwDKqoIITNJSqYN-T02e/exec';
const KUNCI = 'absen';
let DAFTAR_NAMA = [
  'INTAN NURAINI PUTRI SUDRAJAT',
  'ALFIA RINJANI',
  'TRI RISKA DEWI',
  'CHANTIKA NOVI DEVANTI'
];

const $ = id => document.getElementById(id);
const NAMA_JENIS = {CUTI:'Cuti', IZIN:'Izin', SAKIT:'Sakit'};
let tab = 'absen', terpilih = '', status = null, fotoData = '', sedangKirim = false, baris = [];

/* ---------- jam & tanggal ---------- */
function hariIniStr(){ return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'}); }
function tick(){
  const n = new Date();
  $('jam').textContent = n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).replace('.',':');
  $('tgl').textContent = n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
}
tick(); setInterval(tick, 10000);

function setTanggalCuti(){
  const t = hariIniStr();
  const d = new Date(t + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 365);
  const maks = d.toISOString().slice(0,10);
  $('tglCuti').min = t; $('tglCuti').max = maks;
  if(!$('tglCuti').value) $('tglCuti').value = t;
}
setTanggalCuti();

/* ---------- tab ---------- */
function setTab(t){
  tab = t;
  $('tabAbsen').classList.toggle('aktif', t==='absen');
  $('tabCuti').classList.toggle('aktif', t==='cuti');
  $('panelAbsen').classList.toggle('hidden', t!=='absen');
  $('panelCuti').classList.toggle('hidden', t!=='cuti');
  $('pesan').className = 'pesan';
  ubahTombol();
  if(t==='cuti' && terpilih && $('pin').value.length === 4) muatStatus();
}
$('tabAbsen').onclick = () => setTab('absen');
$('tabCuti').onclick = () => setTab('cuti');

/* ---------- daftar nama ---------- */
function statusDariBaris(nama){
  const r = baris.filter(x => x.nama.toLowerCase() === nama.toLowerCase()).pop();
  if(!r) return null;
  if(NAMA_JENIS[r.masuk]) return r.cuti === 'Menunggu' ? ['cuti', NAMA_JENIS[r.masuk]+' menunggu'] : ['cuti', NAMA_JENIS[r.masuk]];
  if(r.pulang) return ['selesai','Selesai'];
  return ['masuk','Sudah masuk'];
}
function gambarNama(){
  $('pilihNama').innerHTML = '<option value="">Pilih nama…</option>' + DAFTAR_NAMA.map(n => {
    const st = statusDariBaris(n);
    return '<option value="'+n+'"'+(n===terpilih?' selected':'')+'>'+n+(st?'  ('+st[1]+')':'')+'</option>';
  }).join('');
}
$('pilihNama').onchange = e => {
  const n = e.target.value;
  if(!n){ terpilih = ''; status = null; $('pin').value = ''; $('info').className = 'info hidden'; $('infoCuti').className = 'info hidden'; ubahTombol(); return; }
  pilihNama(n);
};

async function pilihNama(n){
  if(!sudahMintaLokasi){ sudahMintaLokasi = true; ambilLokasi(); }
  terpilih = n; status = null; $('pilihNama').value = n;
  try{ localStorage.setItem('absen_nama', n); $('pin').value = localStorage.getItem('absen_pin_'+n) || ''; }catch(e){ $('pin').value = ''; }
  $('infoCuti').className = 'info hidden'; $('daftarCuti').className = 'hidden';
  $('pesan').className = 'pesan';
  ubahTombol();
  await muatStatus();
}

function gambarDaftarCuti(list){
  const el = $('daftarCuti');
  if(!list.length){ el.className = 'hidden'; el.innerHTML = ''; return; }
  const kelas = {Disetujui:'masuk', Ditolak:'cuti'};
  el.innerHTML = '<span class="judul" style="margin:0 0 4px">Catatan kamu</span>' + list.map(c => {
    const t = new Date(c.tanggal + 'T00:00:00Z').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
    return '<div class="cutiBaris"><span>'+esc(c.jenis||'Cuti')+' · '+t+'</span><span class="chip st '+(kelas[c.status]||'')+'">'+esc(c.status)+'</span></div>';
  }).join('');
  el.className = '';
}

async function muatStatus(){
  const n = terpilih, pin = $('pin').value.trim();
  if(!n) return;
  status = null; ubahTombol();
  if(pin.length < 4){ $('info').className = 'info'; $('info').textContent = 'Masukkan PIN kamu.'; return; }
  $('info').className = 'info'; $('info').textContent = 'Mengecek status…';
  try{
    const h = await kirim({aksi:'status', nama:n});
    if(!h.ok){ const er = new Error(h.error || 'gagal'); er.server = true; throw er; }
    if(terpilih !== n) return;
    status = h;
    try{ localStorage.setItem('absen_pin_'+n, pin); }catch(e){}
    let t = '';
    if(h.status==='masuk') t = 'Belum absen hari ini. Kirim akan tercatat sebagai absen masuk.';
    if(h.status==='pulang') t = 'Sudah masuk pukul ' + h.jamMasuk + '. Kirim akan tercatat sebagai absen pulang.';
    if(h.status==='selesai') t = 'Absen hari ini sudah lengkap (masuk ' + (h.jamMasuk||'-') + ', pulang ' + h.jamPulang + ').';
    if(h.status==='cuti') t = 'Hari ini tercatat ' + (h.jenis||'cuti').toLowerCase() + '.';
    $('info').textContent = t;
    $('infoCuti').textContent = 'Tahun ini: cuti ' + h.cutiTahunIni + ' hari · izin ' + (h.izinTahunIni||0) + ' hari · sakit ' + (h.sakitTahunIni||0) + ' hari.' + (h.cutiMenunggu ? ' Menunggu persetujuan: ' + h.cutiMenunggu + ' hari.' : '');
    $('infoCuti').className = 'info';
    gambarDaftarCuti(h.cutiDaftar || []);
  }catch(e){
    if(e.server){
      $('info').textContent = e.message;
      if(e.message === 'PIN salah'){ try{ localStorage.removeItem('absen_pin_'+n); }catch(x){} }
    } else {
      $('info').textContent = 'Status belum bisa dimuat (' + (e && e.message ? e.message : 'tidak ada koneksi') + '). Ketuk nama lagi untuk mencoba ulang.';
    }
  }
  ubahTombol();
}

$('pin').oninput = () => {
  $('pin').value = $('pin').value.replace(/\D/g,'').slice(0,4);
  if(terpilih && $('pin').value.length === 4) muatStatus();
  else if(terpilih){ status = null; ubahTombol(); }
};

function teksTombolJenis(){
  const j = $('jenis').value;
  return j === 'Sakit' ? 'Catat sakit' : j === 'Izin' ? 'Ajukan izin' : 'Ajukan cuti';
}
$('jenis').onchange = () => ubahTombol();

function ubahTombol(){
  const a = $('kirimAbsen'), c = $('kirimCuti');
  if(sedangKirim) return;
  if(!terpilih){ a.disabled = c.disabled = true; a.textContent = c.textContent = 'Pilih nama dulu'; return; }
  if(!status){ a.disabled = true; a.textContent = $('pin').value.length < 4 ? 'Masukkan PIN dulu' : 'Memuat status…'; c.disabled = true; c.textContent = 'Masukkan PIN dulu'; return; }
  c.disabled = false; c.textContent = teksTombolJenis();
  if(status.status==='masuk'){ a.disabled = false; a.textContent = 'Kirim absen masuk'; }
  else if(status.status==='pulang'){ a.disabled = false; a.textContent = 'Kirim absen pulang'; }
  else { a.disabled = true; a.textContent = status.status==='cuti' ? 'Hari ini ' + (status.jenis||'cuti').toLowerCase() : 'Absen hari ini sudah lengkap'; }
}

/* ---------- foto ---------- */
function prosesGambar(src, w, h){
  const sk = Math.min(1, 720 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * sk); c.height = Math.round(h * sk);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  fotoData = c.toDataURL('image/jpeg', 0.7);
  $('kotakFoto').innerHTML = '<img alt="Foto selfie" src="'+fotoData+'">';
}

$('ambilFoto').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => { prosesGambar(img, img.width, img.height); URL.revokeObjectURL(url); };
  img.src = url;
};

// Laptop/PC: buka webcam langsung. HP: tetap kamera depan lewat input file.
let streamKamera = null;
function tutupKamera(){
  if(streamKamera){ streamKamera.getTracks().forEach(t => t.stop()); streamKamera = null; }
  $('kamera').classList.add('hidden');
}
$('kotakFoto').addEventListener('click', async e => {
  const desktop = !window.matchMedia('(pointer:coarse)').matches;
  if(!desktop || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return; // pakai input file
  e.preventDefault();
  try{
    streamKamera = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    $('vid').srcObject = streamKamera;
    $('kamera').classList.remove('hidden');
  }catch(err){
    tampilPesan('Kamera tidak bisa dibuka. Izinkan akses kamera di browser, lalu coba lagi.', 'err');
  }
});
$('jepret').onclick = () => {
  const v = $('vid');
  if(!v.videoWidth) return;
  prosesGambar(v, v.videoWidth, v.videoHeight);
  tutupKamera();
};
$('batalKamera').onclick = tutupKamera;

function ambilLokasi(){
  return new Promise(res => {
    if(!navigator.geolocation) return res({err:'tidak_didukung'});
    const ok = p => res({lat:p.coords.latitude, lng:p.coords.longitude});
    const gagal = e => res({err: e.code === 1 ? 'ditolak' : (e.code === 3 ? 'timeout' : 'tidak_tersedia')});
    // 1) cepat: lokasi dari Wi-Fi/jaringan (boleh hasil beberapa menit terakhir)
    navigator.geolocation.getCurrentPosition(ok, e => {
      if(e.code === 1) return gagal(e);
      // 2) lambat tapi akurat: GPS satelit, beri waktu lebih lama
      navigator.geolocation.getCurrentPosition(ok, gagal, {enableHighAccuracy:true, timeout:25000, maximumAge:0});
    }, {enableHighAccuracy:false, timeout:8000, maximumAge:120000});
  });
}
const PESAN_LOKASI = {
  ditolak: 'Izin lokasi ditolak. Buka Pengaturan HP > Aplikasi (atau Chrome/Safari) > Izin > Lokasi > Izinkan, lalu buka aplikasi lagi.',
  timeout: 'Lokasi belum didapat (sudah dicoba 30 detik). Pastikan Lokasi HP menyala, dekati jendela atau area terbuka, tunggu sebentar, lalu coba lagi.',
  tidak_tersedia: 'Lokasi HP belum menyala. Nyalakan Lokasi (GPS) di pengaturan HP, lalu coba lagi.',
  tidak_didukung: 'Browser ini tidak mendukung lokasi. Buka lewat Chrome atau Safari, jangan dari dalam WhatsApp atau Instagram.'
};
let sudahMintaLokasi = false;

function tampilPesan(teks, jenis){ const p = $('pesan'); p.textContent = teks; p.className = 'pesan ' + jenis; }

async function kirim(post){
  const r = await fetch(URL_SCRIPT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({kunci:KUNCI, pin:$('pin').value.trim()}, post))});
  return r.json();
}

/* ---------- kirim absen ---------- */
$('kirimAbsen').onclick = async () => {
  if(!terpilih || !status) return;
  if(!fotoData) return tampilPesan('Ambil foto selfie dulu.', 'err');
  const aksi = status.status;
  sedangKirim = true; $('kirimAbsen').disabled = true; $('kirimAbsen').textContent = 'Mengirim…';
  $('pesan').className = 'pesan';
  $('lokasi').className = 'lokasi'; $('lokasi').textContent = 'Mengecek lokasi…';
  const pos = await ambilLokasi();
  if(pos.err){
    $('lokasi').className = 'lokasi gagal'; $('lokasi').textContent = 'Lokasi tidak terdeteksi.';
    tampilPesan(PESAN_LOKASI[pos.err] || 'Lokasi wajib aktif untuk absen.', 'err');
    sedangKirim = false; ubahTombol();
    return;
  }
  $('lokasi').className = 'lokasi ok'; $('lokasi').textContent = 'Lokasi terdeteksi.';
  try{
    const h = await kirim({aksi, nama:terpilih, foto:fotoData, lat:pos.lat, lng:pos.lng});
    if(h.ok){
      tampilPesan('Absen ' + aksi + ' tercatat pukul ' + h.jam + '. Terima kasih!', 'ok');
      fotoData = ''; $('ambilFoto').value = '';
      $('kotakFoto').innerHTML = '<span>Ketuk untuk foto selfie</span><small>Kamera depan akan terbuka</small>';
      sedangKirim = false;
      await muatHariIni();
      await pilihNama(terpilih);
      return;
    } else tampilPesan(h.error || 'Gagal menyimpan.', 'err');
  }catch(e){ tampilPesan('Tidak bisa terhubung. Cek internet lalu coba lagi.', 'err'); }
  sedangKirim = false; ubahTombol();
};

/* ---------- ajukan cuti ---------- */
$('kirimCuti').onclick = async () => {
  if(!terpilih) return;
  const dari = $('tglCuti').value, sampai = dari;
  if(!dari) return tampilPesan('Pilih tanggal dulu.', 'err');
  sedangKirim = true; $('kirimCuti').disabled = true; $('kirimCuti').textContent = 'Mengirim…';
  $('pesan').className = 'pesan';
  try{
    const jenis = $('jenis').value;
    const h = await kirim({aksi:'cuti', nama:terpilih, dari, sampai, jenis});
    if(h.ok){
      tampilPesan(h.menunggu ? 'Pengajuan ' + jenis.toLowerCase() + ' tanggal ' + dari + ' terkirim dan menunggu persetujuan.' : 'Sakit tanggal ' + dari + ' tercatat. Semoga lekas sembuh!', 'ok');
      sedangKirim = false;
      await muatHariIni();
      await pilihNama(terpilih);
      return;
    } else tampilPesan(h.error || 'Gagal menyimpan.', 'err');
  }catch(e){ tampilPesan('Tidak bisa terhubung. Cek internet lalu coba lagi.', 'err'); }
  sedangKirim = false; ubahTombol();
};

/* ---------- daftar hari ini ---------- */
async function muatHariIni(){
  try{
    const h = await kirim({aksi:'hariini'});
    if(!h.ok) throw 0;
    baris = h.rows;
    $('hariIni').innerHTML = baris.length
      ? baris.map(r => '<div class="baris"><span>'+esc(r.nama)+'</span><span class="w">'+(NAMA_JENIS[r.masuk] ? (r.cuti==='Menunggu' ? NAMA_JENIS[r.masuk]+' (menunggu)' : NAMA_JENIS[r.masuk]) : 'masuk '+(r.masuk||'-')+' · pulang '+(r.pulang||'-'))+'</span></div>').join('')
      : '<div class="kosong">Belum ada yang absen hari ini.</div>';
  }catch(e){ $('hariIni').innerHTML = '<div class="kosong">Daftar belum bisa dimuat.</div>'; }
  gambarNama();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

gambarNama();
(async () => {
  try{ const h = await kirim({aksi:'daftar'}); if(h.ok && h.nama.length) DAFTAR_NAMA = h.nama; }catch(e){}
  await muatHariIni();
  try{ const n = localStorage.getItem('absen_nama'); if(n && DAFTAR_NAMA.indexOf(n) >= 0) pilihNama(n); }catch(e){}
})();
</script>
